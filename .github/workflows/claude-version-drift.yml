name: Claude version drift

on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: claude-version-drift
  cancel-in-progress: false

jobs:
  latest-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bun install --frozen-lockfile

      - name: Resolve version drift
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          PINNED=$(tr -d '[:space:]' < .github/claude-code-version)
          LATEST=$(npm view @anthropic-ai/claude-code version)
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Claude Code $PINNED is already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Testing Claude Code drift: $PINNED -> $LATEST" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run candidate compatibility gate
        if: steps.versions.outputs.changed == 'true'
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/claude-code"
          npm install --prefix "$PREFIX" "@anthropic-ai/claude-code@${{ steps.versions.outputs.latest }}"
          export PATH="$PREFIX/node_modules/.bin:$PATH"
          ACTUAL=$(claude --version | awk '{print $1}')
          test "$ACTUAL" = "${{ steps.versions.outputs.latest }}"
          python3 -m pip install pygame Pillow
          AIFIRST_ASSET_RUNTIME=1 bun run check
          AIFIRST_CLAUDE_LIVE=1 AIFIRST_ASSET_RUNTIME=1 bun run explore:learn:full

      - name: Upload candidate reports
        if: always() && steps.versions.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-drift-${{ steps.versions.outputs.latest }}
          path: test-results/learn-exploration/
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested Claude Code version
        if: always() && steps.versions.outputs.changed == 'true' && steps.gate.outcome == 'success'
        env:
          VERSION: ${{ steps.versions.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > .github/claude-code-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/claude-code-version
          git commit -m "chore(test): pin Claude Code $VERSION" -m "Full compatibility suite passed: $RUN_URL"
          git push origin HEAD:main
          TITLE="Claude Code $VERSION compatibility failure"
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "Claude Code $VERSION passed and is now pinned. $RUN_URL"
          fi

      - name: Report candidate incompatibility
        if: always() && steps.versions.outputs.changed == 'true' && steps.gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.versions.outputs.latest }}
          PINNED: ${{ steps.versions.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Claude Code $VERSION compatibility failure"
          BODY="Claude Code $VERSION failed the full compatibility gate against pinned version $PINNED. Reports are attached to $RUN_URL. The supported pin was not changed."
          gh label create claude-compat --color B60205 --description "Claude Code compatibility" --force
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label claude-compat --body "$BODY"
          fi

      - name: Fail incompatible candidate
        if: always() && steps.versions.outputs.changed == 'true' && steps.gate.outcome != 'success'
        run: exit 1
