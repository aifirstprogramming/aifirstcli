name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build and verify artifacts but never publish a GitHub release.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  learn-compatibility:
    uses: ./.github/workflows/learn-compatibility.yml
    permissions:
      contents: read
      issues: write

  build-linux:
    needs: learn-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # The binary reports package.json's version, while `aifirst update`
      # compares against the release tag. A manual run is a build-only dry run.
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG=$(jq -r .version package.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify content is in sync
        run: bun scripts/sync-content.ts --check

      - run: bunx tsc -p tsconfig.json
      - run: bun test

      - name: Build Linux targets
        run: bun scripts/build.ts

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: bin/*
          if-no-files-found: error

  # Bun can only write Windows version resources on a Windows build host. These
  # are the unsigned inputs that will be submitted to SignPath after approval.
  build-windows:
    needs: learn-compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Verify content is in sync
        run: bun scripts/sync-content.ts --check

      - name: Build Windows targets with release metadata
        run: bun scripts/build.ts

      - name: Verify PE metadata
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $numericVersion = ($packageVersion -split '[-+]')[0]
          $expectedVersion = "$numericVersion.0"

          foreach ($file in Get-ChildItem bin/aifirst-windows-*.exe) {
            $info = $file.VersionInfo
            if ($info.ProductName -ne 'AI First CLI') {
              throw "$($file.Name): unexpected product name '$($info.ProductName)'"
            }
            if ($info.CompanyName -ne 'AI First Programming') {
              throw "$($file.Name): unexpected company name '$($info.CompanyName)'"
            }
            if ($info.ProductVersion -ne $expectedVersion) {
              throw "$($file.Name): unexpected product version '$($info.ProductVersion)'"
            }
            if ($info.FileVersion -ne $expectedVersion) {
              throw "$($file.Name): unexpected file version '$($info.FileVersion)'"
            }
            if ($info.FileDescription -ne 'Companion CLI for the AI First Programming book series') {
              throw "$($file.Name): unexpected description '$($info.FileDescription)'"
            }
            if ($info.LegalCopyright -ne 'Copyright (c) 2026 Stephen Chin, Cassandra Chin, and Jennifer Reif') {
              throw "$($file.Name): unexpected copyright '$($info.LegalCopyright)'"
            }
          }

      - name: Smoke test Windows release binaries
        shell: pwsh
        run: |
          & bin/aifirst-windows-x64.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = & bin/aifirst-windows-x64.exe show py-1-01 --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($output -join "`n") -notmatch 'Hello, World!') { throw 'compiled content smoke test failed' }
          & bin/aifirst-windows-x64-baseline.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-unsigned
          path: bin/*
          if-no-files-found: error

  # macOS must build on macOS: Apple Silicon refuses to execute an unsigned
  # arm64 binary, so a Linux-cross-compiled darwin artifact dies on launch.
  build-darwin:
    needs: learn-compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-content.ts --check

      - name: Build darwin targets
        run: bun scripts/build.ts

      # Ad-hoc signing (-s -) is the minimum that lets the binary run on Apple
      # Silicon. Real Developer ID signing and notarization are separate work.
      - name: Codesign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          IDENTITY="-"
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
            security create-keychain -p actions build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p actions build.keychain
            security import /tmp/cert.p12 -k build.keychain \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
            IDENTITY="$MACOS_SIGN_IDENTITY"
            rm -f /tmp/cert.p12
          else
            echo "::notice::No signing certificate configured; using ad-hoc signature."
          fi

          for f in bin/aifirst-darwin-*; do
            codesign --force --timestamp=none \
              --entitlements scripts/entitlements.plist \
              --sign "$IDENTITY" "$f"
            codesign --verify --verbose "$f"
          done

      - name: Smoke test the native binary
        run: |
          ARCH=$(uname -m)
          BIN=$([ "$ARCH" = "arm64" ] && echo bin/aifirst-darwin-arm64 || echo bin/aifirst-darwin-x64)
          "$BIN" --version
          "$BIN" show py-1-01 --format json | grep -q 'Hello, World'

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin
          path: bin/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [learn-compatibility, build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # This remains after every platform-specific operation. Once SignPath is
      # connected, the signed Windows artifact will replace the unsigned input
      # before this step runs.
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum aifirst-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/aifirst-*
            artifacts/SHA256SUMS
