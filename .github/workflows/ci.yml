name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Content in sync with @aifirst/content
        run: bun scripts/sync-content.ts --check

      - name: Typecheck
        run: bunx tsc -p tsconfig.json

      - name: Test
        run: bun test

      # Proves the content actually embeds and the binary runs standalone —
      # the failure mode unit tests cannot see.
      - name: Build and smoke test
        shell: bash
        run: |
          bun scripts/build.ts --local
          BIN=$(ls bin/aifirst-* | head -n1)
          "$BIN" --version
          "$BIN" show py-1-01 --format json | grep -q 'Hello, World!'
          "$BIN" progress --format json | grep -q '"total": 38'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.sh
        run: shellcheck --shell=sh install/install.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses cleanly"
