name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Content in sync with @aifirst/content
        run: bun scripts/sync-content.ts --check

      - name: Typecheck
        run: bunx tsc -p tsconfig.json

      - name: Test
        run: bun test

      # Proves the content actually embeds and the binary runs standalone —
      # the failure mode unit tests cannot see.
      - name: Build and smoke test
        shell: bash
        run: |
          bun scripts/build.ts --local
          BIN=$(ls bin/aifirst-* | head -n1)
          "$BIN" --version
          "$BIN" show py-1-01 --format json | grep -q 'Hello, World!'
          # Count non-retired examples; must match the pack, not a fixed number.
          EXPECTED=$(node -p "let t=0;const fs=require('fs');for(const f of fs.readdirSync('books').filter(x=>x.endsWith('.json'))){const d=JSON.parse(fs.readFileSync('books/'+f));for(const s of d.sections||[])for(const c of s.chapters||[])for(const e of c.examples||[])if(e.status!=='retired')t++;}t")
          "$BIN" progress --format json | grep -q "\"total\": $EXPECTED"

  learn-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Explore deterministic learn contracts
        run: bun run explore:learn:pr

      - name: Upload exploration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learn-contract-report
          path: test-results/learn-exploration/
          if-no-files-found: error
          retention-days: 14

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.sh
        run: shellcheck --shell=sh install/install.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

  windows-duckling-replay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: python -m pip install pygame-ce Pillow
      - name: Execute portable Save the Duckling replay
        shell: pwsh
        run: |
          $env:AIFIRST_DUCKLING_PORTABLE = "1"
          $env:AIFIRST_PYTHON = (Get-Command python).Source
          bun test test/windows-duckling-replay.test.ts
